[project]
name = "gsc-cli"
version = "0.2.0"
description = "gsc command-line tool for Google Search Console, with an MCP wrapper (gsc-mcp)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28,<2",
    "google-api-python-client",
    "google-auth",
]

[project.scripts]
gsc = "gsc_cli.cli:main"
gsc-mcp = "gsc_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsc_cli", "src/gsc_mcp"]

[dependency-groups]
dev = ["ruff", "pytest"]
