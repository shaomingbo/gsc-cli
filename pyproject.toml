[project]
name = "gsc-mcp"
version = "0.1.0"
description = "MCP server for Google Search Console API"
requires-python = ">=3.11"
dependencies = [
    "mcp",
    "google-api-python-client",
    "google-auth",
]

[project.scripts]
gsc-mcp = "gsc_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsc_mcp"]

[dependency-groups]
dev = ["ruff"]
